# GENERATED by scripts/make_k_configs.py -- do not hand-edit.
# Anchor-count sweep: this file differs from pusht_dino_p256_td.yaml in EXACTLY two lines,
# `td.n_modes` and `td.anchor_artifact`. Verify with:
#   diff configs/pusht_dino_p256_td_k5.yaml configs/pusht_dino_p256_td_k40.yaml
# DINO-P256 Patch Policy on PushT -- P6 paired arms.
#
# THIS FILE IS HALF OF A PAIR. `pusht_dino_p256_vqbet.yaml` and
# `pusht_dino_p256_td.yaml` must differ in EXACTLY ONE LINE: `action_head`. The
# fairness guard in doc/patch_policy_td_vs_vqbet.md is `diff` of the two files, and
# it is expected to print one line. Edit both, or neither.
#
# Baseline lineage: patch_policy phase9 `dino_s42/43/44` ep100 -> final_cov
# 0.505/0.512/0.549, success 9/12/12% (n=100). `native_parity: true` makes the
# trunk a bit-for-bit fork of that run (lm_head Linear(512->256) + tanh-GELU +
# native head MLP), so the VQ-BeT arm has an EXTERNAL reference to reproduce; the
# TD arm is compared against an arm that was first shown to reproduce something.
#
# `td:` is present in BOTH files on purpose. The VQ-BeT arm parses it and never
# reads it; keeping it identical is what makes the one-line diff possible.

seed: 42
split_seed: 42
device: cuda
encoder_name: dino
policy_mode: patch

# ---- data (native phase9 protocol) ----
dataset_root: /path/to/pusht_dataset            # <-- SET THIS to your PushT dataset root
train_fraction: 0.9
obs_window_size: 5
action_window_size: 5
use_relative_actions: false

# ---- training (native phase9 protocol: 100 epochs, from scratch, NO resume, NO init) ----
batch_size: 8
epochs: 100
lr: 5.5e-5
weight_decay: 2.0e-4
betas: [0.9, 0.999]
num_workers: 4
eval_freq_epochs: 10          # validation loss cadence ONLY; rollout cadence is --ckpt-epochs
save_ckpt: true

# ---- DINO main stream (frozen, P=256 native patch tokens) ----
dino:
  name: dinov2_vits14
  feature_key: x_norm_patchtokens
  postprocess: null
  dtype: fp32
  n_patches: 256
  output_dim: 384
  freeze: true
  encode_batch_size: 32

# ---- fusion: DISABLED (clean line) ----
fusion:
  enabled: false

# ---- policy trunk: IDENTICAL for both arms (native phase9 + native_parity fork) ----
policy:
  n_layer: 8
  n_head: 8
  n_embd: 512
  dropout: 0.0
  vqvae_latent_dim: 512
  vqvae_n_embed: 16
  vqvae_groups: 2
  vqvae_iters: 1000
  vqvae_batch_size: 1024
  vqvae_fit_steps: null
  act_scale: 500.0
  offset_loss_multiplier: 10.0
  secondary_code_multiplier: 0.5
  gamma: 2.0
  native_parity: true

# ---- truncated-diffusion head (READ ONLY BY THE TD ARM) ----
td:
  n_modes: 5
  cls_from: refined           # canonical D2: one refined z_k feeds BOTH heads
  num_layers: 2
  n_heads: 8
  d_ffn: 1024
  dropout: 0.0
  pos_embed_dim: 64
  num_train_timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  beta_schedule: scaled_linear
  train_t_max: 50
  infer_steps: 2
  infer_t_start: 49
  use_diffusiondrive_timesteps: false
  noise_seed: 31337
  cls_weight: 10.0
  reg_weight: 8.0
  diff_weight: 1.0
  focal_gamma: 2.0
  focal_alpha: 0.25
  cls_bias_prior: 0.01
  anchor_artifact: anchors/pusht_kmeans_K5.pt

# ---- output: NOT set here; --save-dir is passed per arm so this stays a 1-line diff ----
save_dir: outputs/pusht_p6_ARM        # overridden by --save-dir on every launch
action_head: td
